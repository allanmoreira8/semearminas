<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Semear Minas - Em manutenção</title>
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif; color: #333;
        background: linear-gradient(135deg, #f1f8ec 0%, #ffffff 60%);
        padding: 24px 16px;
      }
      .card {
        max-width: 560px; width: 100%; background: #fff; border-radius: 16px; padding: 40px 32px;
        text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid #7FBC4E;
      }
      .logo { width: 200px; max-width: 70%; height: auto; }
      h1 { font-size: 26px; margin: 28px 0 12px; color: #2d5a1b; }
      p { font-size: 16px; line-height: 1.6; color: #555; margin: 0 0 14px; }
      .contacts { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
      .contacts a {
        display: block; padding: 13px 16px; border-radius: 50px; text-decoration: none; font-weight: 600;
        background: linear-gradient(135deg, #7FBC4E 0%, #18d26e 100%); color: #fff;
      }
      .contacts a.secondary { background: #fff; color: #2d5a1b; border: 2px solid #7FBC4E; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="images/logo-default-415x103.png" alt="Semear Minas">
      <h1>Site em manutenção</h1>
      <p>Estamos fazendo alguns ajustes e voltamos em breve.</p>
      <p>Para doar ou tirar dúvidas, fale com a gente:</p>
      <div class="contacts">
        <a href="https://wa.me/5531993437929" target="_blank" rel="noopener">WhatsApp (31) 99343-7929</a>
        <a class="secondary" href="https://www.instagram.com/gruposemearminas/" target="_blank" rel="noopener">Instagram @gruposemearminas</a>
      </div>
    </main>
  </body>
</html>
